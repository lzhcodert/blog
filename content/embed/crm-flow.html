<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系统交互流转图</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1d1d1f}
#canvas{position:relative;width:100%;height:100vh;min-height:560px;overflow:hidden;touch-action:none;cursor:grab;background:#fff}
#canvas.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;width:1200px;transform-origin:0 0;will-change:transform}
svg{display:block;width:1200px;height:980px}
.hint{position:fixed;left:10px;bottom:10px;z-index:5;font-size:11px;color:#6e6e73;background:rgba(242,242,247,.92);border:.5px solid rgba(0,0,0,.08);padding:6px 10px;border-radius:8px;pointer-events:none}
.reset{position:fixed;right:10px;bottom:10px;z-index:5;font-size:11px;color:#007aff;background:rgba(234,243,255,.95);border:.5px solid rgba(0,122,255,.25);padding:6px 11px;border-radius:8px;cursor:pointer}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
</style>
</head>
<body>
<div id="canvas">
  <div id="stage">
    <svg viewBox="0 0 1200 980" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#007aff"/></marker>
        <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1d9e75"/></marker>
        <marker id="ap" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#af52de"/></marker>
        <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#ff9500"/></marker>
      </defs>

      <rect x="0" y="0" width="1200" height="980" fill="#ffffff"/>
      <text x="36" y="38" font-size="21" font-weight="700" fill="#1d1d1f">XX银行 CRM 系统 · 交互流转图</text>
      <text x="36" y="58" font-size="12" fill="#8e8e93">数据集市「异步批量 + 数据交换平台双向摆渡」供数链路与调度触发机制</text>

      <!-- ============ 系统流转总览 ============ -->
      <text x="36" y="92" font-size="16" font-weight="700" fill="#1d1d1f">一、系统流转总览（完善版）</text>
      <text x="36" y="112" font-size="11.5" fill="#8e8e93">实线双向 = 同步实时调用　·　实线 = 上报入湖　·　虚线 = 集市回供　·　文件 API = 对象存储存取</text>

      <g transform="translate(36,126)">
        <rect x="0" y="0" width="1128" height="150" rx="14" fill="#fbfbfd" stroke="#e5e5ea"/>
        <g font-size="12" text-anchor="middle">
          <rect x="24" y="26" width="200" height="46" rx="10" fill="#eaf3ff" stroke="#007aff"/><text x="124" y="47" font-weight="700" fill="#1d1d1f">客户经理 / CRM</text><text x="124" y="63" fill="#6e6e73">查看全景画像</text>
          <rect x="298" y="26" width="210" height="46" rx="10" fill="#eaf3ff" stroke="#007aff"/><text x="403" y="47" font-weight="700" fill="#1d1d1f">ESF / ESB 网关</text><text x="403" y="63" fill="#6e6e73">同步实时调用</text>
          <rect x="582" y="26" width="210" height="46" rx="10" fill="#eaf3ff" stroke="#007aff"/><text x="687" y="47" font-weight="700" fill="#1d1d1f">客户 / 账户微服务</text><text x="687" y="63" fill="#6e6e73">秒级聚合返回</text>
          <rect x="866" y="26" width="238" height="46" rx="10" fill="#eaf3ff" stroke="#007aff"/><text x="985" y="47" font-weight="700" fill="#1d1d1f">客户视图 / 营销名单</text><text x="985" y="63" fill="#6e6e73">业绩看板</text>
        </g>
        <line x1="226" y1="49" x2="296" y2="49" stroke="#007aff" stroke-width="1.6" marker-end="url(#ab)"/>
        <line x1="510" y1="49" x2="580" y2="49" stroke="#007aff" stroke-width="1.6" marker-end="url(#ab)"/>
        <line x1="794" y1="49" x2="864" y2="49" stroke="#007aff" stroke-width="1.6" marker-end="url(#ab)"/>

        <g font-size="12" text-anchor="middle">
          <rect x="24" y="92" width="200" height="42" rx="10" fill="#f1faf5" stroke="#1d9e75"/><text x="124" y="118" fill="#1d1d1f">交互行为数据</text>
          <rect x="298" y="92" width="210" height="42" rx="10" fill="#f1faf5" stroke="#1d9e75"/><text x="403" y="118" fill="#1d1d1f">数据交换平台</text>
          <rect x="582" y="92" width="210" height="42" rx="10" fill="#faf4fd" stroke="#af52de"/><text x="687" y="118" fill="#1d1d1f">数据集市加工</text>
          <rect x="866" y="92" width="238" height="42" rx="10" fill="#faf4fd" stroke="#af52de"/><text x="985" y="118" fill="#1d1d1f">异步回供 CRM 落库</text>
        </g>
        <line x1="226" y1="113" x2="296" y2="113" stroke="#1d9e75" stroke-width="1.6" marker-end="url(#ag)"/>
        <line x1="510" y1="113" x2="580" y2="113" stroke="#1d9e75" stroke-width="1.6" marker-end="url(#ag)"/>
        <line x1="794" y1="113" x2="864" y2="113" stroke="#af52de" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ap)"/>

        <rect x="866" y="26" width="238" height="46" rx="10" fill="none" stroke="#ff9500" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="985" y="8" font-size="10.5" fill="#ff9500" text-anchor="middle">次日营销优化</text>
      </g>

      <!-- 文件通道 -->
      <g transform="translate(36,292)">
        <rect x="0" y="0" width="1128" height="60" rx="12" fill="#fff8ee" stroke="#ff9500"/>
        <text x="22" y="25" font-size="13" font-weight="700" fill="#ff9500">文件通道 · 信创 OBS</text>
        <text x="22" y="45" font-size="12" fill="#6e6e73">录音 / 语音转写 / 分析报告经 API 存入对象存储，CRM 数据库仅保存文件引用地址（URL），不落地文件本体。</text>
      </g>

      <!-- ============ 数据加工与消费链路 ============ -->
      <text x="36" y="392" font-size="16" font-weight="700" fill="#1d1d1f">二、数据加工与消费链路（单向主链）</text>
      <text x="36" y="412" font-size="11.5" fill="#8e8e93">「加工与消费」模式：集市把通用数据加工成 CRM 专用的「即取即用」数据，CRM 只负责消费</text>

      <g transform="translate(36,428)">
        <g font-size="12.5" text-anchor="middle">
          <rect x="0" y="20" width="180" height="52" rx="10" fill="#f2f2f7" stroke="#8e8e93"/><text x="90" y="42" font-weight="700" fill="#1d1d1f">源系统 / 数仓</text><text x="90" y="60" fill="#6e6e73">原始数据</text>
          <rect x="228" y="20" width="180" height="52" rx="10" fill="#f2f2f7" stroke="#8e8e93"/><text x="318" y="42" font-weight="700" fill="#1d1d1f">ODS 层</text><text x="318" y="60" fill="#6e6e73">ETL 原始快照</text>
          <rect x="456" y="20" width="180" height="52" rx="10" fill="#f2f2f7" stroke="#8e8e93"/><text x="546" y="42" font-weight="700" fill="#1d1d1f">DWD / DWS 层</text><text x="546" y="60" fill="#6e6e73">清洗 · 汇总宽表</text>
          <rect x="684" y="20" width="200" height="52" rx="10" fill="#faf4fd" stroke="#af52de"/><text x="784" y="42" font-weight="700" fill="#af52de">数据集市（核心）</text><text x="784" y="60" fill="#6e6e73">宽表 / 标签 / 模型</text>
          <rect x="930" y="20" width="176" height="52" rx="10" fill="#eaf3ff" stroke="#007aff"/><text x="1018" y="42" font-weight="700" fill="#007aff">CRM 消费</text><text x="1018" y="60" fill="#6e6e73">视图 / 营销 / 看板</text>
        </g>
        <line x1="182" y1="46" x2="226" y2="46" stroke="#8e8e93" stroke-width="1.6" marker-end="url(#ab)"/>
        <line x1="410" y1="46" x2="454" y2="46" stroke="#8e8e93" stroke-width="1.6" marker-end="url(#ab)"/>
        <line x1="638" y1="46" x2="682" y2="46" stroke="#8e8e93" stroke-width="1.6" marker-end="url(#ab)"/>
        <line x1="886" y1="46" x2="928" y2="46" stroke="#af52de" stroke-width="1.6" marker-end="url(#ap)"/>

        <g font-size="11.5" fill="#6e6e73">
          <text x="90" y="94" text-anchor="middle">① 数据汇聚</text>
          <text x="318" y="94" text-anchor="middle">② 逐层加工</text>
          <text x="546" y="94" text-anchor="middle">③ 统一口径</text>
          <text x="784" y="94" text-anchor="middle">④ 按 CRM 需求加工</text>
          <text x="1018" y="94" text-anchor="middle">⑤ 即取即用</text>
        </g>
        <rect x="684" y="108" width="200" height="26" rx="8" fill="#faf4fd"/>
        <text x="784" y="126" font-size="11" fill="#af52de" text-anchor="middle">通用数据 → CRM 专用数据</text>
      </g>

      <!-- ============ 三种触发机制 ============ -->
      <text x="36" y="566" font-size="16" font-weight="700" fill="#1d1d1f">三、集市加工完成后如何触发数交调度</text>

      <g transform="translate(36,580)">
        <rect x="0" y="0" width="360" height="150" rx="14" fill="#f1faf5" stroke="#1d9e75"/>
        <text x="20" y="30" font-size="14" font-weight="700" fill="#1d9e75">文件就绪触发</text>
        <text x="270" y="30" font-size="11" fill="#1d9e75">最常用</text>
        <text x="20" y="56" font-size="12" fill="#6e6e73">集市产出数据文件后，再生成一个空的</text>
        <text x="20" y="76" font-size="12" fill="#6e6e73">触发器文件；DataStage 的 Wait for</text>
        <text x="20" y="96" font-size="12" fill="#6e6e73">File 阶段持续监测，发现即启动。</text>
        <text x="20" y="126" font-size="11.5" fill="#1d9e75">稳健、易管理 · 适合 T+1 批量</text>

        <rect x="384" y="0" width="360" height="150" rx="14" fill="#eaf3ff" stroke="#007aff"/>
        <text x="404" y="30" font-size="14" font-weight="700" fill="#007aff">消息触发</text>
        <text x="654" y="30" font-size="11" fill="#007aff">准实时</text>
        <text x="404" y="56" font-size="12" fill="#6e6e73">集市完成后向 MQ / Kafka 发送消息，</text>
        <text x="404" y="76" font-size="12" fill="#6e6e73">DataStage 通过 WebSphere MQ 阶段或</text>
        <text x="404" y="96" font-size="12" fill="#6e6e73">Kafka / JMS 适配器消费并触发作业。</text>
        <text x="404" y="126" font-size="11.5" fill="#007aff">时效要求高 · 技术可行</text>

        <rect x="768" y="0" width="360" height="150" rx="14" fill="#f2f2f7" stroke="#8e8e93"/>
        <text x="788" y="30" font-size="14" font-weight="700" fill="#6e6e73">调度平台触发</text>
        <text x="1038" y="30" font-size="11" fill="#6e6e73">企业级</text>
        <text x="788" y="56" font-size="12" fill="#6e6e73">由 TASKCTL / iMOIA.SMS 等平台集中</text>
        <text x="788" y="76" font-size="12" fill="#6e6e73">管理，Agent 依据作业依赖关系触发，</text>
        <text x="788" y="96" font-size="12" fill="#6e6e73">支持失败重试、告警与统一运维。</text>
        <text x="788" y="126" font-size="11.5" fill="#6e6e73">统一运维 · 企业级治理</text>
      </g>

      <!-- ============ 一句话概括 ============ -->
      <g transform="translate(36,750)">
        <rect x="0" y="0" width="1128" height="66" rx="14" fill="#1d1d1f"/>
        <text x="24" y="28" font-size="12" fill="#a1a1a6">一句话概括</text>
        <text x="24" y="50" font-size="13.5" fill="#ffffff">ESF/ESB 管「服务调用」的实时控制　·　数据交换平台管「数据流转」的双向摆渡（异步批量为主）　·　信创 OBS 管「文件存储」的海量承载</text>
      </g>

      <text x="36" y="852" font-size="11" fill="#a1a1a6">注：实时营销名单、风险预警等时效敏感场景可由 API 同步调用或 MQ 准实时补充；数据集市核心产出仍以批量异步交付为主。</text>
      <text x="36" y="962" font-size="11" fill="#a1a1a6">按文档内容重绘 · 供架构交流参考　|　滚轮缩放 · 拖拽平移 · 双击复位</text>
    </svg>
  </div>
</div>
<div class="hint">滚轮缩放 · 拖拽平移 · 双击复位</div>
<div class="reset" id="reset">复位</div>
<script>
(function(){
  var canvas=document.getElementById('canvas'),stage=document.getElementById('stage');
  var scale=1,tx=0,ty=0,drag=false,lx=0,ly=0;
  function apply(){stage.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';}
  function fit(){var w=canvas.clientWidth;scale=Math.min(1,w/1200);tx=0;ty=0;apply();}
  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    var ns=Math.min(4,Math.max(.5,scale*(e.deltaY<0?1.15:1/1.15)));
    tx=mx-(mx-tx)*ns/scale;ty=my-(my-ty)*ns/scale;scale=ns;apply();
  },{passive:false});
  canvas.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX-tx;ly=e.clientY-ty;canvas.classList.add('drag');canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',function(e){if(!drag)return;tx=e.clientX-lx;ty=e.clientY-ly;apply();});
  canvas.addEventListener('pointerup',function(){drag=false;canvas.classList.remove('drag');});
  canvas.addEventListener('pointercancel',function(){drag=false;canvas.classList.remove('drag');});
  canvas.addEventListener('dblclick',fit);
  document.getElementById('reset').addEventListener('click',fit);
  window.addEventListener('resize',fit);
  fit();
})();
</script>
</body>
</html>
